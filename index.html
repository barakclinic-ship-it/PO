<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="PO — נוכחות לפי זיהוי פנים">
<title>PO</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PO">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
<style>
:root{
  --bg:#ffffff; --soft:#f3faff; --sky:#e3f3fd; --line:#e4eef6;
  --blue:#2aa7e8; --blue-d:#1287c7; --ink:#12304a; --mute:#7b93a6; --danger:#e25c5c;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,sans-serif}
body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:36px;height:36px;object-fit:contain}
.brand h1{margin:0;font-size:22px;font-weight:700;letter-spacing:1px;line-height:1}
.brand small{display:block;font-size:11px;color:var(--mute);font-weight:400;letter-spacing:0;margin-top:2px}
.hbtns{display:flex;gap:2px}
#instBtn{display:none}#instBtn.show{display:grid}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--mute)}
.ib:active{background:var(--sky)}
.ib.on{color:var(--blue);background:var(--sky)}
.ib svg{width:22px;height:22px}
main{max-width:720px;margin:0 auto;padding:16px}
.view{display:none}.view.act{display:block}

/* capture */
.hero{background:var(--soft);border:1px solid var(--line);border-radius:24px;padding:28px 18px;text-align:center}
.hero .circ{width:72px;height:72px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 12px;color:var(--blue)}
.hero .circ svg{width:34px;height:34px}
.hero p{margin:0 0 18px;color:var(--mute);font-size:14px}
.row2{display:flex;gap:10px;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:14px;font-weight:500;font-size:15px}
.btn.pri{background:var(--blue);color:#fff}
.btn.pri:active{background:var(--blue-d)}
.btn.sec{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.ghost{color:var(--blue)}
.btn.dan{color:var(--danger)}
.btn.full{width:100%}
.btn svg{width:18px;height:18px}
.status{text-align:center;color:var(--mute);font-size:13px;min-height:20px;margin:12px 0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--sky);border-top-color:var(--blue);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px;margin-left:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 12px}
.sechead h2{margin:0;font-size:17px;font-weight:500}
.sechead small{color:var(--mute);font-size:13px}
.chips{display:flex;gap:6px;margin:-4px 2px 14px;flex-wrap:wrap}
.chip{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--sky);color:var(--blue-d)}
.chip.o{background:#fff;border:1px dashed #b9daef;color:var(--mute)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:12px}
.tile{display:block;text-align:center;padding:0}
.tile .ph{position:relative;aspect-ratio:35/45;border-radius:14px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .nm{display:block;font-size:13px;margin-top:6px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ln{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.known .ph::after{content:"";position:absolute;top:7px;left:7px;width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 2px #fff}
.tile.unk .ph{border:2px dashed #9fd2f0}
.tile.unk .nm{color:var(--blue);font-weight:500}
.tile.skip{opacity:.35}
.sugg{display:flex;align-items:center;gap:12px;background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin:14px 0 4px}
.sugg img{width:46px;height:46px;border-radius:50%;object-fit:cover}
.sugg .n{flex:1;font-size:15px}
.sugg .btn{height:40px;padding:0 14px;font-size:14px}

/* people */
.search{width:100%;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--soft);padding:0 14px;outline:none}
.search:focus{border-color:var(--blue);background:#fff}
.empty{text-align:center;color:var(--mute);padding:40px 10px;font-size:14px}
.gbar{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 0;padding:2px 16px;scrollbar-width:none}
.gbar::-webkit-scrollbar{display:none}
.gwrap{display:flex;gap:8px;flex-wrap:wrap}
.gchip{flex:none;height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:14px;white-space:nowrap;color:var(--ink)}
.gchip small{color:var(--mute);margin-inline-start:4px;font-size:12px}
.gchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.gchip.on small{color:rgba(255,255,255,.8)}
.gchip.add{border-style:dashed;color:var(--blue)}
.sechead .lnk{color:var(--blue);font-size:14px;font-weight:500;padding:4px 2px}
.tile.picked .ph{border-color:var(--blue);box-shadow:0 0 0 2.5px var(--blue)}
.tile.picked .ph::after{content:"✓";position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:13px;display:grid;place-items:center}
.tile.dim .ph{opacity:.55}

/* attendance */
.day{margin-bottom:18px}
.day h3{font-size:13px;font-weight:500;color:var(--mute);margin:0 4px 8px}
.ses{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:8px;text-align:right}
.ses:active{background:var(--soft)}
.ses .t{font-weight:500;font-size:16px;min-width:50px}
.ses .c{font-size:13px;color:var(--mute)}
.avs{display:flex;margin-inline-start:auto;flex-direction:row-reverse}
.avs img,.avs span{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid #fff;margin-inline-start:-8px;background:var(--sky)}
.avs span{display:grid;place-items:center;font-size:11px;color:var(--blue-d)}

/* sheet */
.back{position:fixed;inset:0;background:rgba(18,48,74,.28);opacity:0;pointer-events:none;transition:.2s;z-index:20}
.back.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:#fff;border-radius:26px 26px 0 0;max-height:92vh;overflow:auto;
  transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:10px 18px calc(24px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.pp{display:block;width:150px;aspect-ratio:35/45;object-fit:cover;border-radius:18px;margin:4px auto 12px;border:1px solid var(--line)}
.sheet h2{text-align:center;margin:0;font-size:22px;font-weight:500}
.meta{text-align:center;color:var(--mute);font-size:13px;margin:4px 0 16px}
.fl{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.fr{display:flex;align-items:center;gap:10px;padding:0 14px;min-height:50px;border-bottom:1px solid var(--line)}
.fr:last-child{border-bottom:0}
.fr label{color:var(--mute);font-size:13px;width:92px;flex:none}
.fr .v{flex:1;font-size:15px}
.fr input{flex:1;border:0;outline:0;height:48px;background:transparent;font-size:15px;min-width:0}
.fr input:focus{color:var(--blue-d)}
.fr .x{color:var(--mute);width:28px;height:28px;border-radius:8px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.acts .btn{flex:1}
.sub{font-size:14px;font-weight:500;margin:20px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.sub small{font-weight:400;color:var(--mute)}
.list{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);width:100%;text-align:right}
.li:last-child{border-bottom:0}
.li img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--sky)}
.li .n{flex:1;font-size:15px}
.li .d{color:var(--mute);font-size:13px}
.li .a{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--mute)}
.li .a.add{color:var(--blue)}
.li .a svg{width:18px;height:18px}
.li.off img{filter:grayscale(1);opacity:.6}
.li.off .n{color:var(--mute)}
.sel{width:100%;height:46px;border:1px solid var(--line);border-radius:14px;padding:0 12px;background:var(--soft);margin-bottom:8px}
.dt{width:100%;height:46px;border:1px solid var(--blue);border-radius:14px;padding:0 12px;margin:6px 0}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:12px;margin:18px 0 10px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

/* dialog */
.dlg{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:rgba(18,48,74,.32);padding:20px}
.dlg.on{display:grid}
.dlgb{background:#fff;border-radius:24px;padding:22px 20px 16px;width:100%;max-width:330px;text-align:center}
.dlgb h4{margin:0 0 4px;font-size:17px;font-weight:500}
.dlgb p{margin:0 0 14px;color:var(--mute);font-size:13px}
.dlgb input{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--soft);text-align:center;font-size:20px;outline:0;letter-spacing:4px}
.dlgb input.txt{letter-spacing:0;font-size:16px}
.dlgb input:focus{border-color:var(--blue);background:#fff}
.dlgb .acts{margin-top:14px}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);padding:6px 18px;border-radius:14px}
nav button svg{width:24px;height:24px}
nav button.act{color:var(--blue)}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;z-index:50;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.hide{display:none!important}
.selbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));z-index:7;display:none;gap:8px;padding:10px 16px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);max-width:720px;margin:0 auto}
.selbar.on{display:flex}
#v-ppl,#v-att{padding-bottom:70px}
.ses.picked{border-color:var(--blue);box-shadow:0 0 0 1.5px var(--blue);background:var(--soft)}
.ses.dim{opacity:.6}
.ses .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid #b9daef;flex:none;display:grid;place-items:center;font-size:13px;color:#fff}
.ses.picked .ck{background:var(--blue);border-color:var(--blue)}
.ses.picked .ck::after{content:"✓"}
.day h3.dsel{cursor:pointer;display:flex;justify-content:space-between}
.day h3.dsel span{color:var(--blue)}
.selbar .btn{flex:1;height:44px;padding:0 8px;font-size:14px}
.selbar .btn:disabled{opacity:.4}
</style>
</head>
<body>

<header>
  <div class="brand"><img src="logo.png" alt=""><h1>PO<small>נוכחות</small></h1></div>
  <div class="hbtns">
    <button class="ib" id="instBtn" aria-label="התקנה כאפליקציה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14"/></svg></button>
    <button class="ib" id="shareBtn" aria-label="שיתוף"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="17.5" cy="5.5" r="2.5"/><circle cx="6.5" cy="12" r="2.5"/><circle cx="17.5" cy="18.5" r="2.5"/><path d="M8.7 10.7l6.6-3.9M8.7 13.3l6.6 3.9"/></svg></button>
    <button class="ib" id="lockBtn" aria-label="נעילה"></button>
    <button class="ib" id="setBtn" aria-label="הגדרות"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>

<main>
  <section class="view act" id="v-cap">
    <div class="hero">
      <div class="circ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="4"/></svg></div>
      <p>צלמו את הקבוצה — המערכת תזהה כל פרצוף<br>ותרשום נוכחות לפי זמן הצילום</p>
      <div class="row2">
        <label class="btn pri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>צילום<input type="file" accept="image/*" capture="environment" class="hide" id="fCam"></label>
        <label class="btn sec">מהגלריה<input type="file" accept="image/*" class="hide" id="fGal"></label>
      </div>
    </div>
    <div class="status" id="status"></div>
    <div id="result"></div>
  </section>

  <section class="view" id="v-ppl">
    <input class="search" id="q" placeholder="חיפוש לפי שם…">
    <div class="gbar" id="gbar"></div>
    <div class="sechead" id="pplHead"></div>
    <div class="grid" id="pplGrid"></div>
  </section>

  <section class="view" id="v-att">
    <div class="sechead" style="margin-top:4px" id="attHead"></div>
    <div id="attList"></div>
  </section>
</main>

<nav>
  <button data-v="v-cap" class="act"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="4"/></svg>צילום</button>
  <button data-v="v-ppl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.6c2.6.2 4.4 2 5 4.9"/></svg>אנשים</button>
  <button data-v="v-att"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M8.5 14.5l2 2 4-4"/></svg>נוכחות</button>
</nav>

<div class="selbar" id="selbar"></div>
<div class="back" id="back"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>

<div class="dlg" id="dlg"><div class="dlgb" id="dlgb">
  <h4 id="dlgT"></h4><p id="dlgP"></p>
  <input id="dlgI">
  <div class="acts"><button class="btn sec" id="dlgNo">ביטול</button><button class="btn pri" id="dlgOk">אישור</button></div>
</div></div>

<input type="file" accept="application/json" class="hide" id="fImp">
<div class="toast" id="toast"></div>

<script>
const MODEL='https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model';
const LOCK_MS=5*60*1000;   // נעילה אוטומטית אחרי 5 דקות

const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fullName=p=>[p.first,p.last].filter(Boolean).join(' ')||'ללא שם';
const fDate=ts=>new Date(ts).toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'numeric',year:'numeric'});
const fShort=ts=>new Date(ts).toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'2-digit'});
const fTime=ts=>new Date(ts).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
const dayKey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const toLocalInput=ts=>{const d=new Date(ts);return new Date(ts-d.getTimezoneOffset()*60000).toISOString().slice(0,16)};

/* ---------- storage (IndexedDB) ---------- */
let S={people:[],fields:[],sessions:[],groups:[],code:'1234',sens:'normal'};
const G=id=>S.groups.find(g=>g.id===id);
const byName=(a,b)=>fullName(a).localeCompare(fullName(b),'he');
function setPhoto(p,crop,ts){if(ts>=(p.photoTs||0)){p.photo=crop;p.photoTs=ts}} // תמונה = הצילום האחרון
const idb={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('nochechut',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  get(k){return new Promise(res=>{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)})},
  set(k,v){return new Promise((res,rej)=>{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
};
async function save(){try{await idb.set('state',S)}catch(e){toast('שגיאה בשמירה')}}
const P=id=>S.people.find(p=>p.id===id);
const SES=id=>S.sessions.find(s=>s.id===id);

/* ---------- ui helpers ---------- */
let tT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2200)}
function setStatus(h){$('#status').innerHTML=h}
let sheetOnClose=null;
function openSheet(html,onClose){$('#sheetBody').innerHTML=html;$('#sheet').scrollTop=0;$('#back').classList.add('on');$('#sheet').classList.add('on');sheetOnClose=onClose||null}

/* dialog: code / text */
function dialog({title,text='',type='text',value='',placeholder='',check,okText='אישור',danger=false}){
  return new Promise(res=>{
    const d=$('#dlg'),i=$('#dlgI'),b=$('#dlgb');
    $('#dlgT').textContent=title;$('#dlgP').textContent=text;
    i.type=type==='code'?'password':'text';i.inputMode=type==='code'?'numeric':'text';
    i.className=type==='code'?'':'txt';i.value=value;i.placeholder=placeholder;
    const conf=type==='confirm';i.classList.toggle('hide',conf);
    const okB=$('#dlgOk');okB.textContent=okText;okB.style.background=danger?'var(--danger)':'';
    d.classList.add('on');if(!conf)setTimeout(()=>i.focus(),60);
    const done=v=>{d.classList.remove('on');i.oninput=i.onkeydown=null;$('#dlgOk').onclick=$('#dlgNo').onclick=null;res(v)};
    const ok=()=>{if(conf){done('yes');return}const v=i.value.trim();if(check&&!check(v)){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');i.value='';return}done(v)};
    $('#dlgOk').onclick=ok;$('#dlgNo').onclick=()=>done(null);
    i.onkeydown=e=>{if(e.key==='Enter')ok()};
    i.oninput=()=>{if(type==='code'&&i.value.length>=S.code.length)ok()};
  });
}

function paintLock(){const b=$('#lockBtn');b.innerHTML=unlocked?ICON_OPEN:ICON_LOCK;b.classList.toggle('on',unlocked)}
function touchLock(){clearTimeout(lockT);lockT=setTimeout(lock,LOCK_MS)}

async function withCode(fn){
  if(unlocked){touchLock();return fn()}
  const v=await dialog({title:'הזינו קוד',text:'שינויים מוגנים בקוד',type:'code',check:v=>v===S.code});

/* ---------- face engine ---------- */
let modelsReady;
function loadModels(){
  modelsReady=(async()=>{
    if(typeof faceapi==='undefined')throw new Error('lib');
    setStatus('טוען מנוע זיהוי<span class="spin"></span>');
    try{await faceapi.tf.setBackend('webgl')}catch(e){}
    await faceapi.tf.ready();
    await Promise.all([faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL),faceapi.nets.faceLandmark68Net.loadFromUri(MODEL),faceapi.nets.faceRecognitionNet.loadFromUri(MODEL)]);
    setStatus('');
  })();
  modelsReady.catch(()=>setStatus('לא ניתן לטעון את מנוע הזיהוי — בדקו חיבור לאינטרנט'));
}
function dist(a,b){let s=0;for(let i=0;i<128;i++){const d=a[i]-b[i];s+=d*d}return Math.sqrt(s)}
function minDist(desc,p){let m=9;for(const d of p.descriptors){const x=dist(desc,d);if(x<m)m=x}return m}
function learn(p,desc,d){ // שומר דוגמאות מגוונות כדי לשפר זיהוי עם הזמן
  if(d!==undefined&&d<0.2)return false;
  if(p.descriptors.length&&dist(p.descriptors[0],desc)>SAMPLE_MAX+.05)return false;
  p.descriptors.push(desc);
  if(p.descriptors.length>20)p.descriptors.splice(1,1);
  return true;
}
// רגישות: [זיהוי בטוח, זיהוי אם אין מתחרה קרוב]
const SENS={strict:{a:.48,b:.53,label:'מחמיר'},normal:{a:.55,b:.61,label:'רגיל'},loose:{a:.6,b:.66,label:'רגיש'}};
const SUGGEST=.72; // מתחת לזה — "אולי זה X?"
const LEARN_MAX=.45; // לומדים לבד רק מזיהוי בטוח; אישור ידני תמיד מלמד
const SAMPLE_MAX=.6; // דגימה רחוקה מדי מהפרצוף המקורי = כנראה מישהו אחר
function fileToCanvas(file,max){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');
    c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c)};
  im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}
function passport(src,b){ // חיתוך ביחס פספורט 35x45
  const cx=b.x+b.width/2,cy=b.y+b.height/2,w=b.width*1.75,h=w*45/35;
  const o=document.createElement('canvas');o.width=280;o.height=360;const g=o.getContext('2d');
  g.imageSmoothingQuality='high';g.fillStyle='#fff';g.fillRect(0,0,280,360);g.drawImage(src,cx-w/2,cy-h*.47,w,h,0,0,280,360);
  return o.toDataURL('image/jpeg',.88);
}
// ניתוח אחיד: זיהוי וטביעת פנים על 1600px, חיתוך התמונה מהרזולוציה המלאה
async function analyze(hi){
  const k=Math.min(1,1600/Math.max(hi.width,hi.height)),c=document.createElement('canvas');
  c.width=Math.round(hi.width*k);c.height=Math.round(hi.height*k);c.getContext('2d').drawImage(hi,0,0,c.width,c.height);
  const dets=await faceapi.detectAllFaces(c,new faceapi.SsdMobilenetv1Options({minConfidence:.45,maxResults:150})).withFaceLandmarks().withFaceDescriptors();
  const s=hi.width/c.width;
  return dets.map(d=>{const b=d.detection.box;return {box:{x:b.x*s,y:b.y*s,width:b.width*s,height:b.height*s},desc:Array.from(d.descriptor)}});
}
function imgToCanvas(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);res(c)};im.onerror=rej;im.src=src})}
const largest=a=>a.reduce((m,x)=>!m||x.box.width>m.box.width?x:m,null);

/* ---------- capture ---------- */
let cur=null; // {sid, faces:[{crop,desc,pid,sug,skip}]}
async function handleFile(file){
  if(!file)return;
  purgeEmpty();
  $('#result').innerHTML='';
  setStatus('מזהה פרצופים<span class="spin"></span>');
  try{await modelsReady}catch(e){return}
  let hi;try{hi=await fileToCanvas(file,3000)}catch(e){setStatus('');toast('לא ניתן לפתוח את התמונה');return}
  await new Promise(r=>setTimeout(r,30));
  const found=await analyze(hi);
  if(!found.length){setStatus('');toast('לא נמצאו פרצופים בתמונה');return}
  found.sort((a,b)=>b.box.x-a.box.x); // מימין לשמאל
  const faces=found.map(x=>({crop:passport(hi,x.box),desc:x.desc,pid:null,sug:null,d:9,skip:false,no:[]}));
  setStatus('');
  matchFaces(faces);
  const ts=(file.lastModified&&file.lastModified<=Date.now()+60000)?file.lastModified:Date.now();
  const ses={id:uid(),ts,present:[]};
  faces.forEach(f=>{if(f.pid){const p=P(f.pid);ses.present.push(f.pid);f.prev={photo:p.photo,ts:p.photoTs};f.learned=f.d<LEARN_MAX&&learn(p,f.desc,f.d);setPhoto(p,f.crop,ts)}});
  S.sessions.push(ses);await save();
  cur={sid:ses.id,faces};renderCapture();renderAtt();renderPeople();
}
function matchFaces(faces){
  const T=SENS[S.sens]||SENS.normal,usable=S.people.filter(p=>p.descriptors&&p.descriptors.length);
  const ranks=faces.map(f=>usable.map(p=>({p,d:minDist(f.desc,p)})).sort((a,b)=>a.d-b.d));
  // מועמדים: בטוח, או קרוב מספיק כשאין מתחרה צמוד
  const cand=[];
  ranks.forEach((r,i)=>r.forEach((x,j)=>{if(x.d>=T.b)return;const rival=r[j===0?1:0];
    if(x.d<T.a||!rival||rival.d-x.d>.08)cand.push({i,p:x.p,d:x.d})}));
  cand.sort((a,b)=>a.d-b.d);const uf=new Set(),up=new Set();
  for(const x of cand){if(uf.has(x.i)||up.has(x.p.id))continue;uf.add(x.i);up.add(x.p.id);faces[x.i].pid=x.p.id;faces[x.i].d=x.d}
  // הצעות לפרצופים שלא זוהו
  faces.forEach((f,i)=>{if(f.pid)return;const s=ranks[i].find(x=>!up.has(x.p.id));if(s&&s.d<SUGGEST)f.sug=s.p.id});
}
['#fCam','#fGal'].forEach(s=>$(s).onchange=e=>{const f=e.target.files[0];e.target.value='';handleFile(f)});

function renderCapture(){
  const r=$('#result');if(!cur){r.innerHTML='';return}
  const ses=SES(cur.sid);if(!ses){cur=null;r.innerHTML='';return}
  const known=cur.faces.filter(f=>f.pid).length,unk=cur.faces.filter(f=>!f.pid&&!f.skip).length;
  r.innerHTML=`<div class="sechead"><h2>${fDate(ses.ts)}</h2><small>${fTime(ses.ts)}</small></div>
  <div class="chips"><span class="chip">${known} נוכחים</span>${unk?`<span class="chip o">${unk} לא מזוהים — הקישו כדי לתת שם</span>`:''}</div>
  <div class="grid">${cur.faces.map((f,i)=>{const p=f.pid&&P(f.pid),sg=!p&&!f.skip&&f.sug&&!ses.present.includes(f.sug)&&!(f.no||[]).includes(f.sug)&&P(f.sug);
    return `<button class="tile ${p?'known':f.skip?'skip':'unk'}" data-i="${i}"><div class="ph"><img src="${f.crop}"></div>
    <span class="nm">${p?esc(p.first||fullName(p)):f.skip?'דולג':sg?'אולי '+esc(sg.first||fullName(sg))+'?':'מי זה?'}</span>${p&&p.last?`<span class="ln">${esc(p.last)}</span>`:''}</button>`}).join('')}</div>
  <div style="margin-top:22px"><button class="btn sec full" id="doneBtn">סיום</button></div>`;
  r.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{const f=cur.faces[+t.dataset.i];if(f.pid)personSheet(f.pid,false,+t.dataset.i);else nameSheet(+t.dataset.i)});
  $('#doneBtn').onclick=()=>{purgeEmpty();cur=null;renderCapture();toast('הנוכחות נשמרה')};
}
function purgeEmpty(){const n=S.sessions.length;S.sessions=S.sessions.filter(s=>s.present.length||(cur&&s.id===cur.sid&&cur.faces.some(f=>!f.pid&&!f.skip)));if(S.sessions.length!==n){save();renderAtt()}}

function fieldInputs(vals={}){
  return `<div class="fl" id="ff">
    <div class="fr"><label>שם פרטי</label><input data-k="first" value="${esc(vals.first)}" autocomplete="off"></div>
    <div class="fr"><label>שם משפחה</label><input data-k="last" value="${esc(vals.last)}" autocomplete="off"></div>
    ${S.fields.map(f=>`<div class="fr"><label>${esc(f)}</label><input data-f="${esc(f)}" value="${esc((vals.extra||{})[f])}" autocomplete="off"></div>`).join('')}
  </div>`;
}
function readInputs(){const o={first:'',last:'',extra:{}};$('#ff').querySelectorAll('input').forEach(i=>{if(i.dataset.k)o[i.dataset.k]=i.value.trim();else o.extra[i.dataset.f]=i.value.trim()});return o}
async function addField(){const n=await dialog({title:'שדה חדש',text:'השדה יופיע בכרטיס של כולם',placeholder:'למשל: טלפון, חגורה, הערות'});
  if(!n)return false;if(['שם פרטי','שם משפחה'].includes(n)||S.fields.includes(n)){toast('השדה כבר קיים');return false}
  S.fields.push(n);await save();return true}

function nameSheet(i){
  const f=cur.faces[i],ses=SES(cur.sid);
  const others=S.people.filter(p=>!ses.present.includes(p.id)&&!(f.no||[]).includes(p.id)).sort(byName);
  const gsel=new Set(curGroup?[curGroup]:[]);
  const sg=f.sug&&!ses.present.includes(f.sug)&&!(f.no||[]).includes(f.sug)&&P(f.sug);
  const draw=(vals)=>{
    openSheet(`<img class="pp" src="${f.crop}"><h2>מי זה?</h2>
      ${sg?`<div class="sugg"><img src="${sg.photo}"><span class="n">אולי <b>${esc(fullName(sg))}</b>?</span><button class="btn pri" id="sgYes">כן, זה ${esc(sg.first||fullName(sg))}</button></div>
      <div class="or">או אדם חדש</div>`:'<div class="meta">אדם חדש</div>'}
      ${fieldInputs(vals)}
      <div class="sub">קבוצות</div>
      <div class="gwrap" id="ng">${S.groups.map(g=>`<button class="gchip ${gsel.has(g.id)?'on':''}" data-g="${g.id}">${esc(g.name)}</button>`).join('')}<button class="gchip add" id="ngAdd">+ קבוצה</button></div>
      <div class="acts" style="margin-top:10px"><button class="btn ghost" id="af">+ הוסף שדה</button></div>
      <button class="btn pri full" id="sv">שמירה</button>
      ${others.length?`<div class="or">או שזה מישהו שכבר קיים</div>
      <select class="sel" id="ex"><option value="">בחרו מהרשימה…</option>${others.map(p=>`<option value="${p.id}">${esc(fullName(p))}</option>`).join('')}</select>
      <button class="btn sec full" id="asg">שיוך</button>`:''}
      <div class="acts" style="margin-top:14px"><button class="btn dan" id="sk">${f.skip?'בטל דילוג':'דלג על הפרצוף הזה'}</button></div>`);
    setTimeout(()=>{const fi=$('#ff input');if(fi&&!vals)fi.focus()},300);
    $('#af').onclick=async()=>{const v=readInputs();if(await addField())draw(v)};
    $('#ng').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const g=b.dataset.g;gsel.has(g)?gsel.delete(g):gsel.add(g);b.classList.toggle('on')});
    $('#ngAdd').onclick=async()=>{const v=readInputs();const g=await newGroup();if(g){gsel.add(g.id);draw(v)}};
    $('#sv').onclick=async()=>{const v=readInputs();if(!v.first&&!v.last){toast('הזינו שם');return}
      const p={id:uid(),first:v.first,last:v.last,extra:v.extra,groups:[...gsel],photo:f.crop,photoTs:ses.ts,descriptors:[f.desc],created:Date.now()};
      S.people.push(p);ses.present.push(p.id);f.pid=p.id;f.skip=false;await save();closeSheet();renderAll();toast('נשמר ✓')};
    if($('#sgYes'))$('#sgYes').onclick=async()=>{const p=sg;f.prev={photo:p.photo,ts:p.photoTs};f.learned=learn(p,f.desc);setPhoto(p,f.crop,ses.ts);ses.present.push(p.id);f.pid=p.id;f.skip=false;
      await save();closeSheet();renderAll();toast('נרשם: '+fullName(p)+' ✓')};
    if($('#asg'))$('#asg').onclick=async()=>{const id=$('#ex').value;if(!id)return;const p=P(id);
      f.prev={photo:p.photo,ts:p.photoTs};f.learned=learn(p,f.desc);setPhoto(p,f.crop,ses.ts);ses.present.push(id);f.pid=id;f.skip=false;await save();closeSheet();renderAll();toast('שויך ל'+fullName(p))};
    $('#sk').onclick=()=>{f.skip=!f.skip;closeSheet();renderCapture()};
  };
  draw();
}

/* ---------- person card ---------- */
async function undoMatch(fi){
  const f=cur.faces[fi],ses=SES(cur.sid),p=f&&P(f.pid);if(!p||!ses)return;
  if(f.learned){const s=JSON.stringify(f.desc);p.descriptors=p.descriptors.filter(d=>d!==f.desc&&JSON.stringify(d)!==s);if(!p.descriptors.length)p.descriptors=[f.desc]}
  if(f.prev&&p.photo===f.crop){p.photo=f.prev.photo;p.photoTs=f.prev.ts}
  if(!cur.faces.some((x,i)=>i!==fi&&x.pid===p.id))ses.present=ses.present.filter(x=>x!==p.id);
  (f.no=f.no||[]).push(p.id);f.pid=null;f.sug=null;f.learned=false;
  await save();closeSheet();renderAll();setTimeout(()=>nameSheet(fi),320);
}
function personSheet(id,edit=false,fi=null){
  const p=P(id);if(!p)return;
  const att=S.sessions.filter(s=>s.present.includes(id)).sort((a,b)=>b.ts-a.ts);
  const rows=[['שם פרטי',p.first],['שם משפחה',p.last],...S.fields.map(f=>[f,(p.extra||{})[f]])];
  openSheet(`<img class="pp" src="${p.photo}"><h2>${esc(fullName(p))}</h2>
    <div class="meta">${att.length} נוכחויות${att.length?' · אחרונה '+fShort(att[0].ts):''}</div>
    ${fi!==null&&cur&&cur.faces[fi]&&cur.faces[fi].pid===id?`<div class="sugg"><img src="${cur.faces[fi].crop}"><span class="n">זוהה בצילום הזה</span><button class="btn sec" id="notMe" style="color:var(--danger)">זה לא ${esc(p.first||fullName(p))}</button></div>`:''}
    ${edit?fieldInputs(p):`<div class="fl">${rows.map(([l,v])=>`<div class="fr"><label>${esc(l)}</label><div class="v">${esc(v)||'<span style="color:#c3d3df">—</span>'}</div></div>`).join('')}</div>`}
    <div class="acts">${edit
      ?`<button class="btn ghost" id="af">+ הוסף שדה</button><button class="btn pri" id="sv">שמירה</button>`
      :`<button class="btn sec" id="ed">עריכה</button><button class="btn ghost" id="af">+ הוסף שדה</button>`}</div>
    <div class="sub">קבוצות <small>הקישו לשיוך / ביטול</small></div>
    <div class="gwrap" id="pg">${S.groups.map(g=>`<button class="gchip ${(p.groups||[]).includes(g.id)?'on':''}" data-g="${g.id}">${esc(g.name)}</button>`).join('')}<button class="gchip add" id="pgAdd">+ קבוצה</button></div>
    <div class="sub">נוכחות <small>${att.length}</small></div>
    ${att.length?`<div class="list">${att.map(s=>`<button class="li" data-s="${s.id}"><span class="n">${fDate(s.ts)}</span><span class="d">${fTime(s.ts)}</span></button>`).join('')}</div>`:'<div class="empty" style="padding:16px">אין עדיין נוכחות</div>'}
    ${edit?`<div class="list" style="margin-top:18px"><label class="li" style="cursor:pointer"><span class="n">תמונה חדשה לזיהוי<br><small style="color:var(--mute)">מאפס את הזיהוי של ${esc(p.first||fullName(p))} לפי תמונה אחת ברורה</small></span><input type="file" accept="image/*" class="hide" id="newPh"></label></div>
`:''}
    <div class="acts" style="margin-top:18px"><button class="btn dan" id="del">מחיקת ${esc(p.first||'האדם')}</button></div>`);
  if($('#notMe'))$('#notMe').onclick=()=>undoMatch(fi);
  if($('#newPh'))$('#newPh').onchange=e=>withCode(async()=>{const file=e.target.files[0];e.target.value='';if(!file)return;
    toast('מנתח…');try{await modelsReady;const hi=await fileToCanvas(file,3000);const x=largest(await analyze(hi));
      if(!x){toast('לא נמצא פרצוף בתמונה');return}
      p.photo=passport(hi,x.box);p.photoTs=Date.now();p.descriptors=[x.desc];await save();renderAll();personSheet(id,true);toast('הזיהוי אופס ✓')}
    catch(err){toast('לא ניתן לנתח את התמונה')}});
  $('#af').onclick=()=>withCode(async()=>{const v=edit?readInputs():null;if(await addField()){if(v)Object.assign(p,{first:v.first,last:v.last,extra:{...p.extra,...v.extra}});personSheet(id,true)}});
  if($('#ed'))$('#ed').onclick=()=>withCode(()=>personSheet(id,true));
  if($('#sv'))$('#sv').onclick=()=>withCode(async()=>{const v=readInputs();p.first=v.first;p.last=v.last;p.extra={...p.extra,...v.extra};await save();renderAll();personSheet(id);toast('עודכן ✓')});
  $('#del').onclick=()=>withCode(async()=>{if(await deletePeople([id]))closeSheet()});
  document.querySelectorAll('#sheetBody .li[data-s]').forEach(b=>b.onclick=()=>sessionSheet(b.dataset.s));
  $('#pg').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>withCode(async()=>{toggleMember(p,b.dataset.g);b.classList.toggle('on');await save();renderPeople()}));
  $('#pgAdd').onclick=()=>withCode(async()=>{const g=await newGroup();if(!g)return;toggleMember(p,g.id);await save();renderPeople();
    const b=document.createElement('button');b.className='gchip on';b.dataset.g=g.id;b.textContent=g.name;
    b.onclick=()=>withCode(async()=>{toggleMember(p,g.id);b.classList.toggle('on');await save();renderPeople()});$('#pgAdd').before(b)});
}

/* ---------- delete helpers ---------- */
async function deletePeople(ids){
  if(!ids.length)return false;
  const one=ids.length===1&&P(ids[0]);

  if(!ok)return false;
  const set=new Set(ids);S.people=S.people.filter(x=>!set.has(x.id));S.sessions.forEach(s=>s.present=s.present.filter(x=>!set.has(x)));
  if(cur)cur.faces.forEach(f=>{if(set.has(f.pid))f.pid=null});purgeEmpty();await save();renderAll();toast(one?'נמחק':ids.length+' נמחקו');return true;

async function deleteGroup(gid){
  const g=G(gid);if(!g)return false;

/* ---------- export / settings ---------- */
function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function exportCSV(){
  if(!S.sessions.length){toast('אין נתונים לייצוא');return}
  const ss=[...S.sessions].sort((a,b)=>a.ts-b.ts);
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const head=['שם פרטי','שם משפחה','קבוצות',...S.fields,'סה"כ',...ss.map(s=>fShort(s.ts)+' '+fTime(s.ts))];
  const rows=[...S.people].sort(byName).map(p=>{const m=ss.map(s=>s.present.includes(p.id)?'V':'');
    return [p.first,p.last,(p.groups||[]).map(G).filter(Boolean).map(g=>g.name).join(' / '),...S.fields.map(f=>(p.extra||{})[f]),m.filter(Boolean).length,...m]});
  download('נוכחות-'+dayKey(Date.now())+'.csv','\ufeff'+[head,...rows].map(r=>r.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8');
}

  $('#sImp').onclick=()=>withCode(()=>$('#fImp').click());
  $('#sCsv').onclick=exportCSV;
  $('#sWipe').onclick=()=>withCode(async()=>{const ok=await dialog({title:'למחוק הכל?',text:'הקלידו "מחק" לאישור',check:v=>v==='מחק'});if(ok===null)return;
    S={people:[],fields:[],sessions:[],groups:[],code:S.code};curGroup='';sesG='';cur=null;await save();closeSheet();renderAll();toast('נמחק')});
};
$('#fImp').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());if(!Array.isArray(d.people)||!Array.isArray(d.sessions))throw 0;
    S={people:d.people,fields:d.fields||[],sessions:d.sessions,groups:d.groups||[],code:d.code||S.code};migrate();cur=null;await save();closeSheet();renderAll();toast('שוחזר ✓')}
  catch(err){toast('קובץ גיבוי לא תקין')}};

/* ---------- nav ---------- */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('act',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('act',v.id===b.dataset.v));
  window.scrollTo(0,0);renderSelBar();
});
function renderAll(){renderCapture();renderPeople();renderAtt()}
function migrate(){S.groups=S.groups||[];S.sens=S.sens||'normal';S.people.forEach(p=>{p.groups=p.groups||[];if(!p.photoTs)p.photoTs=p.created||0;
  if(p.descriptors&&p.descriptors.length>1){const o=p.descriptors[0];p.descriptors=p.descriptors.filter((d,i)=>i===0||dist(o,d)<=SAMPLE_MAX)}})}

/* ---------- install / share ---------- */
let deferredPrompt=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
if(isIOS&&!isStandalone())$('#instBtn').classList.add('show');
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('#instBtn').classList.add('show')});
addEventListener('appinstalled',()=>{deferredPrompt=null;$('#instBtn').classList.remove('show');toast('PO הותקנה ✓')});
$('#instBtn').onclick=async()=>{
  if(deferredPrompt){deferredPrompt.prompt();const r=await deferredPrompt.userChoice;deferredPrompt=null;if(r.outcome==='accepted')$('#instBtn').classList.remove('show');return}
  if(isIOS)openSheet(`<img class="pp" src="icon-192.png" style="width:84px;aspect-ratio:1;border-radius:20px"><h2>התקנת PO</h2>
    <div class="meta">באייפון ההתקנה נעשית מתוך ספארי</div>
    <div class="list"><div class="li"><span class="n">1. לוחצים על כפתור השיתוף <b>⎙</b> בתחתית ספארי</span></div>
    <div class="li"><span class="n">2. בוחרים "הוספה למסך הבית"</span></div><div class="li"><span class="n">3. לוחצים "הוסף"</span></div></div>
    <div style="margin-top:18px"><button class="btn pri full" onclick="closeSheet()">הבנתי</button></div>`);
};
$('#shareBtn').onclick=async()=>{
  const data={title:'PO',text:'PO — נוכחות לפי זיהוי פנים',url:location.href.split('#')[0]};
  if(navigator.share){try{await navigator.share(data)}catch(e){}return}
  try{await navigator.clipboard.writeText(data.url);toast('הקישור הועתק')}catch(e){toast(data.url)}
};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

/* ---------- boot ---------- */
(async()=>{
  paintLock();
  try{await idb.open();const st=await idb.get('state');if(st)S={...S,...st}}catch(e){toast('האחסון לא זמין')}
  migrate();S.sessions=S.sessions.filter(s=>s.present.length);
  renderAll();loadModels();
})();
</script>
</body>
</html>
