<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="PO — נוכחות לפי זיהוי פנים">
<title>PO</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PO">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
<style>
:root{
  --bg:#ffffff; --soft:#f3faff; --sky:#e3f3fd; --line:#e4eef6;
  --blue:#2aa7e8; --blue-d:#1287c7; --ink:#12304a; --mute:#7b93a6; --danger:#e25c5c;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,sans-serif}
body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:36px;height:36px;object-fit:contain}
.brand h1{margin:0;font-size:22px;font-weight:700;letter-spacing:1px;line-height:1}
.brand small{display:block;font-size:11px;color:var(--mute);font-weight:400;letter-spacing:0;margin-top:2px}
.hbtns{display:flex;gap:2px}
#instBtn{display:none}#instBtn.show{display:grid}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--mute)}
.ib:active{background:var(--sky)}
.ib.on{color:var(--blue);background:var(--sky)}
.ib svg{width:22px;height:22px}
main{max-width:720px;margin:0 auto;padding:16px}
.view{display:none}.view.act{display:block}

/* capture */
.hero{background:var(--soft);border:1px solid var(--line);border-radius:24px;padding:28px 18px;text-align:center}
.hero .circ{width:72px;height:72px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 12px;color:var(--blue)}
.hero .circ svg{width:34px;height:34px}
.hero p{margin:0 0 18px;color:var(--mute);font-size:14px}
.row2{display:flex;gap:10px;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:14px;font-weight:500;font-size:15px}
.btn.pri{background:var(--blue);color:#fff}
.btn.pri:active{background:var(--blue-d)}
.btn.sec{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.ghost{color:var(--blue)}
.btn.dan{color:var(--danger)}
.btn.full{width:100%}
.btn svg{width:18px;height:18px}
.status{text-align:center;color:var(--mute);font-size:13px;min-height:20px;margin:12px 0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--sky);border-top-color:var(--blue);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px;margin-left:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 12px}
.sechead h2{margin:0;font-size:17px;font-weight:500}
.sechead small{color:var(--mute);font-size:13px}
.chips{display:flex;gap:6px;margin:-4px 2px 14px;flex-wrap:wrap}
.chip{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--sky);color:var(--blue-d)}
.chip.o{background:#fff;border:1px dashed #b9daef;color:var(--mute)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:12px}
.tile{display:block;text-align:center;padding:0}
.tile .ph{position:relative;aspect-ratio:35/45;border-radius:14px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .nm{display:block;font-size:13px;margin-top:6px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ln{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.known .ph::after{content:"";position:absolute;top:7px;left:7px;width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 2px #fff}
.tile.unk .ph{border:2px dashed #9fd2f0}
.tile.unk .nm{color:var(--blue);font-weight:500}
.tile.skip{opacity:.35}
.sugg{display:flex;align-items:center;gap:12px;background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin:14px 0 4px}
.sugg img{width:46px;height:46px;border-radius:50%;object-fit:cover}
.sugg .n{flex:1;font-size:15px}
.sugg .btn{height:40px;padding:0 14px;font-size:14px}

/* people */
.search{width:100%;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--soft);padding:0 14px;outline:none}
.search:focus{border-color:var(--blue);background:#fff}
.empty{text-align:center;color:var(--mute);padding:40px 10px;font-size:14px}
.gbar{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 0;padding:2px 16px;scrollbar-width:none}
.gbar::-webkit-scrollbar{display:none}
.gwrap{display:flex;gap:8px;flex-wrap:wrap}
.gchip{flex:none;height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:14px;white-space:nowrap;color:var(--ink)}
.gchip small{color:var(--mute);margin-inline-start:4px;font-size:12px}
.gchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.gchip.on small{color:rgba(255,255,255,.8)}
.gchip.add{border-style:dashed;color:var(--blue)}
.sechead .lnk{color:var(--blue);font-size:14px;font-weight:500;padding:4px 2px}
.tile.picked .ph{border-color:var(--blue);box-shadow:0 0 0 2.5px var(--blue)}
.tile.picked .ph::after{content:"✓";position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:13px;display:grid;place-items:center}
.tile.dim .ph{opacity:.55}

/* attendance */
.day{margin-bottom:18px}
.day h3{font-size:13px;font-weight:500;color:var(--mute);margin:0 4px 8px}
.ses{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:8px;text-align:start}
.ses:active{background:var(--soft)}
.ses .t{font-weight:500;font-size:16px;min-width:50px}
.ses .c{font-size:13px;color:var(--mute)}
.avs{display:flex;margin-inline-start:auto;flex-direction:row-reverse}
.avs img,.avs span{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid #fff;margin-inline-start:-8px;background:var(--sky)}
.avs span{display:grid;place-items:center;font-size:11px;color:var(--blue-d)}

/* sheet */
.back{position:fixed;inset:0;background:rgba(18,48,74,.28);opacity:0;pointer-events:none;transition:.2s;z-index:20}
.back.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:#fff;border-radius:26px 26px 0 0;max-height:92vh;overflow:auto;
  transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:10px 18px calc(24px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.sheet.on{transform:none}
.grabbar{position:sticky;top:-10px;z-index:3;background:#fff;margin:-10px -18px 4px;padding:10px 0 12px;touch-action:none;cursor:grab}
.grab{width:44px;height:5px;border-radius:9px;background:#d5e3ee;margin:0 auto}
.pp{display:block;width:150px;aspect-ratio:35/45;object-fit:cover;border-radius:18px;margin:4px auto 12px;border:1px solid var(--line)}
.sheet h2{text-align:center;margin:0;font-size:22px;font-weight:500}
.meta{text-align:center;color:var(--mute);font-size:13px;margin:4px 0 16px}
.fl{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.fr{display:flex;align-items:center;gap:10px;padding:0 14px;min-height:50px;border-bottom:1px solid var(--line)}
.fr:last-child{border-bottom:0}
.fr label{color:var(--mute);font-size:13px;width:92px;flex:none}
.fr .v{flex:1;font-size:15px}
.fr input{flex:1;border:0;outline:0;height:48px;background:transparent;font-size:15px;min-width:0}
.fr input:focus{color:var(--blue-d)}
.fr .x{color:var(--mute);width:28px;height:28px;border-radius:8px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.acts .btn{flex:1}
.sub{font-size:14px;font-weight:500;margin:20px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.sub small{font-weight:400;color:var(--mute)}
.list{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.steps{padding-inline-start:20px;line-height:1.7;font-size:14px;margin:6px 0 12px}.steps li{margin-bottom:8px}.steps a{color:var(--blue)}
.li{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);width:100%;text-align:start}
.li:last-child{border-bottom:0}
.li img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--sky)}
.li .n{flex:1;font-size:15px}
.li .d{color:var(--mute);font-size:13px}
.li .a{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--mute)}
.li .a.add{color:var(--blue)}
.li .a svg{width:18px;height:18px}
.li.off img{filter:grayscale(1);opacity:.6}
.li.off .n{color:var(--mute)}
.sel{width:100%;height:46px;border:1px solid var(--line);border-radius:14px;padding:0 12px;background:var(--soft);margin-bottom:8px}
.dt{width:100%;height:46px;border:1px solid var(--blue);border-radius:14px;padding:0 12px;margin:6px 0}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:12px;margin:18px 0 10px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

/* dialog */
.dlg{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:rgba(18,48,74,.32);padding:20px}
.dlg.on{display:grid}
.dlgb{background:#fff;border-radius:24px;padding:22px 20px 16px;width:100%;max-width:330px;text-align:center}
.dlgb h4{margin:0 0 4px;font-size:17px;font-weight:500}
.dlgb p{margin:0 0 14px;color:var(--mute);font-size:13px}
.dlgb input{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--soft);text-align:center;font-size:20px;outline:0;letter-spacing:4px}
.dlgb input.txt{letter-spacing:0;font-size:16px}
.dlgb input:focus{border-color:var(--blue);background:#fff}
.dlgb .acts{margin-top:14px}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);padding:6px 18px;border-radius:14px}
nav button svg{width:24px;height:24px}
nav button.act{color:var(--blue)}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;z-index:50;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.hide{display:none!important}
.sesph{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:16px;border:1px solid var(--line);margin:4px 0 6px}
.rephead{display:flex;align-items:center;gap:14px;margin:4px 0 14px}.rephead img{width:58px;height:74px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.rephead h2{text-align:start!important;font-size:20px!important}
.repstat{display:flex;align-items:baseline;gap:10px;background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:14px 0 12px}
.repstat b{font-size:34px;color:var(--blue-d);line-height:1}.repstat span{flex:1;color:var(--mute);font-size:14px}.repstat i{font-style:normal;font-size:22px;font-weight:600;color:var(--blue)}
.pdfper{display:flex;gap:18px;align-items:center;margin-bottom:18px}.pdfper>img{width:105px;height:135px;object-fit:cover;border-radius:12px;border:1px solid #e4eef6}
.pdfper>div:nth-child(2){flex:1}.pdfper h1{margin:0 0 6px;font-size:26px;font-weight:600}.pdfper div div{font-size:13px;color:#12304a;margin-top:2px}.pdfper div div span{color:#7b93a6}
.pdfstat{text-align:center;background:#f3faff;border:1px solid #e3f3fd;border-radius:14px;padding:12px 18px;display:flex;flex-direction:column}
.pdfstat b{font-size:40px;color:#1287c7;line-height:1}.pdfstat span{font-size:12px;color:#7b93a6;margin-top:4px}.pdfstat i{font-style:normal;font-size:20px;font-weight:600;color:#2aa7e8;margin-top:4px}
.pdfhost{position:fixed;left:-12000px;top:0}
.pdfp{width:794px;height:1123px;background:#fff;color:#12304a;font-family:Heebo,system-ui,sans-serif;padding:40px 44px;box-sizing:border-box;display:flex;flex-direction:column}
.pdfh{display:flex;align-items:center;gap:14px;border-bottom:2px solid #e3f3fd;padding-bottom:14px}
.pdfh img{width:44px;height:44px;object-fit:contain}.pdfh div{flex:1;display:flex;flex-direction:column}.pdfh b{font-size:20px}.pdfh span{color:#7b93a6;font-size:13px}.pdfh i{font-style:normal;color:#7b93a6;font-size:12px}
.pdfb{flex:1;overflow:hidden;padding-top:16px}.pdff{text-align:center;color:#9fb3c2;font-size:11px;padding-top:8px}
.pdft h1{margin:0;font-size:24px;font-weight:600}.pdft span{color:#7b93a6;font-size:14px}.pdft{margin-bottom:14px}
.pdfb h2{font-size:15px;color:#1287c7;margin:14px 0 10px;font-weight:600}
.pdfg{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:12px}
.pdfc{text-align:center}.pdfc img{width:100%;aspect-ratio:35/45;object-fit:cover;border-radius:10px;border:1px solid #e4eef6;display:block}.pdfc b{display:block;font-size:13px;margin-top:5px;font-weight:500}.pdfc span{font-size:11px;color:#7b93a6}
.pdfa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}.pdfa div{display:flex;align-items:center;gap:8px;font-size:13px;color:#4a6478}.pdfa img{width:28px;height:28px;border-radius:50%;object-fit:cover;filter:grayscale(1);opacity:.7}
.pdfr{display:grid;align-items:center;min-height:34px;font-size:12px;text-align:center;border-bottom:1px solid #eef4f9}.pdfr.z{background:#f6fbff}
.pdfr.th{font-weight:600;color:#1287c7;background:#e3f3fd;border-radius:8px;min-height:38px;border:0}.pdfr.th small{display:block;font-weight:400;font-size:9px;color:#7b93a6}
.pdfr.tf{font-weight:600;background:#f3faff}.pdfr .nm{display:flex;align-items:center;gap:8px;text-align:start;padding-right:6px;font-size:13px}.pdfr .nm img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.pdfr .v{color:#2aa7e8;font-size:14px}.pdfr .x{color:#9aabb8;font-size:12px}
.pdfr.yes{background:#fff}.pdfr.no{background:#e9eef2;color:#7d8f9c}.pdfr.no img{filter:grayscale(1);opacity:.65}
.pdfr.big{min-height:58px}.pdfr .av{width:44px;height:44px;border-radius:50%;object-fit:cover;display:block;margin:0 auto}.pdfr .nm2{text-align:start;font-size:15px;font-weight:500}
.pdfr .bigv{color:#1fa0e0;font-size:32px;font-weight:900;line-height:1}
.pdfr.grid>div{align-self:stretch;display:flex;align-items:center;justify-content:center}.pdfr.grid>div.nm{justify-content:flex-start}
.pdfr .cy{background:#fff}.pdfr .cn{background:#e9eef2}.pdfr.grid{border-bottom:2px solid #fff}
.pdfphoto{display:block;width:100%;max-height:420px;object-fit:contain;border-radius:12px;margin:0 0 16px;background:#f3faff}
#ac{margin:-4px 0 12px}
#ac .li{background:var(--soft)}
.selbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));z-index:7;display:none;gap:8px;padding:10px 16px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);max-width:720px;margin:0 auto}
.selbar.on{display:flex}
#v-ppl,#v-att{padding-bottom:70px}
.ses.picked{border-color:var(--blue);box-shadow:0 0 0 1.5px var(--blue);background:var(--soft)}
.ses.dim{opacity:.6}
.ses .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid #b9daef;flex:none;display:grid;place-items:center;font-size:13px;color:#fff}
.ses.picked .ck{background:var(--blue);border-color:var(--blue)}
.ses.picked .ck::after{content:"✓"}
.day h3.dsel{cursor:pointer;display:flex;justify-content:space-between}
.day h3.dsel span{color:var(--blue)}
.selbar .btn{flex:1;height:44px;padding:0 8px;font-size:14px}
.selbar .btn:disabled{opacity:.4}
</style>
</head>
<body>

<header>
  <div class="brand"><img src="logo.png" alt=""><h1>PO<small>נוכחות</small></h1></div>
  <div class="hbtns">
    <button class="ib" id="langBtn" aria-label="Language" style="font-size:13px;font-weight:700;color:var(--blue)">EN</button>
    <button class="ib" id="instBtn" aria-label="התקנה כאפליקציה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14"/></svg></button>
    <button class="ib" id="shareBtn" aria-label="שיתוף"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="17.5" cy="5.5" r="2.5"/><circle cx="6.5" cy="12" r="2.5"/><circle cx="17.5" cy="18.5" r="2.5"/><path d="M8.7 10.7l6.6-3.9M8.7 13.3l6.6 3.9"/></svg></button>
    <button class="ib" id="lockBtn" aria-label="נעילה"></button>
    <button class="ib" id="setBtn" aria-label="הגדרות"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>

<main>
  <section class="view act" id="v-cap">
    <div class="hero">
      <div class="circ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="4"/></svg></div>
      <p>צלמו את הקבוצה — המערכת תזהה כל פרצוף<br>ותרשום נוכחות לפי זמן הצילום</p>
      <div class="row2">

const TR_RE=new RegExp('(?<![\\u0590-\\u05FF])(?:'+Object.keys(TR_EN).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![\\u0590-\\u05FF])','g');

function trTree(root){
  if(LANG==='he'||!root)return;

  if(root.nodeType!==1)return;

/* ---------- face engine: two independent fingerprints must agree ---------- */
// one TensorFlow engine runs two different recognition networks on every face:
// A) face-api ResNet (128 numbers, GPU)  B) SFace (128 numbers, CPU/WASM, aligned on 5 face points — robust to head turns)
// a name is given only when BOTH point to the same person
const HU_V=3; // fingerprint B version: 3 = SFace (older ones are rebuilt automatically from the card photo)
let modelsReady,sface=null,yunet=null,sfReady=null,sfWaited=false;
let USE_YN=true,USE_FLIP=true,USE_GROUP=true; // improvements (switchable for testing)
// fingerprint B: SFace (OpenCV Zoo, Apache-2.0) — modern ArcFace-style network, more robust to head turns.
// runs on the CPU (WASM) so it never competes with the GPU engine; model file ships next to index.html.
const ORT_BASE='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/';
function loadSFace(){
  sfReady=(async()=>{
    await withTimeout(loadScript(ORT_BASE+'ort.wasm.min.js'),60000);
    ort.env.wasm.wasmPaths=ORT_BASE;ort.env.wasm.numThreads=1;
    sface=await withTimeout(ort.InferenceSession.create('sface.onnx',{executionProviders:['wasm']}),120000);
    try{yunet=await withTimeout(ort.InferenceSession.create('yunet.onnx',{executionProviders:['wasm']}),60000)}catch(e){yunet=null}
    const z=document.createElement('canvas');z.width=z.height=112;await withTimeout(sfRun(z),60000); // warm-up
  })().catch(()=>{sface=null});
  return sfReady;
}
// ArcFace 112×112 template: eye(img-left), eye(img-right), nose tip, mouth corners
const SF_DST=[[38.2946,51.6963],[73.5318,51.5014],[56.0252,71.7366],[41.5493,92.3655],[70.7299,92.2041]];

  return [m(36,41),m(42,47),[pos[30].x+ox,pos[30].y+oy],[pos[48].x+ox,pos[48].y+oy],[pos[54].x+ox,pos[54].y+oy]]}
function simTransform(src,dst){ // least-squares similarity: u=a·x−b·y+tx, v=b·x+a·y+ty
  let n=src.length,sx=0,sy=0,du=0,dv=0;src.forEach(([x,y],i)=>{sx+=x;sy+=y;du+=dst[i][0];dv+=dst[i][1]});
  const mx=sx/n,my=sy/n,mu=du/n,mv=dv/n;let A=0,B=0,D=0;
  src.forEach(([x,y],i)=>{const X=x-mx,Y=y-my,U=dst[i][0]-mu,V=dst[i][1]-mv;A+=X*U+Y*V;B+=X*V-Y*U;D+=X*X+Y*Y});

async function sfRun(c){ // 112×112 aligned face → 128 numbers
  const d=c.getContext('2d').getImageData(0,0,112,112).data,N=112*112,f=new Float32Array(3*N);
  for(let i=0;i<N;i++){f[i]=d[i*4];f[N+i]=d[i*4+1];f[2*N+i]=d[i*4+2]} // RGB, 0..255 (model normalizes inside)
  const r=await sface.run({data:new ort.Tensor('float32',f,[1,3,112,112])});return Array.from(r[sface.outputNames[0]].data);

async function sfEmb(src,pts){

  const [a,b,tx,ty]=simTransform(pts,SF_DST),c=document.createElement('canvas');c.width=c.height=112;
  const g=c.getContext('2d');g.imageSmoothingQuality='high';g.setTransform(a,b,-b,a,tx,ty);g.drawImage(src,0,0);
  try{const v=await withTimeout(sfRun(c),20000);if(!USE_FLIP)return v;
    const m=document.createElement('canvas');m.width=m.height=112;const mg=m.getContext('2d');mg.setTransform(-1,0,0,1,112,0);mg.drawImage(c,0,0); // mirror image of the aligned face
    const w=await withTimeout(sfRun(m),20000);return v.map((x,i)=>x+w[i])}catch(e){return null}
}
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);
function setBg(t){const e=$('#bgStatus');if(e)e.innerHTML=t||''}

  modelsReady=(async()=>{

    setStatus('טוען מנוע זיהוי<span class="spin"></span>');
    try{await faceapi.tf.setBackend('webgl')}catch(e){}
    await faceapi.tf.ready();
    await Promise.all([faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL),faceapi.nets.faceLandmark68Net.loadFromUri(MODEL),faceapi.nets.faceRecognitionNet.loadFromUri(MODEL)]);
    setStatus('');
    loadSFace().then(upgradePeople); // engine B loads in the background — the app is already usable
  })();
  modelsReady.catch(()=>setStatus('לא ניתן לטעון את מנוע הזיהוי — בדקו חיבור לאינטרנט'));
}
function dist(a,b){let s=0;for(let i=0;i<128;i++){const d=a[i]-b[i];s+=d*d}return Math.sqrt(s)}
function cosd(a,b){let d=0,na=0,nb=0;for(let i=0;i<a.length;i++){d+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i]}return 1-d/Math.sqrt(na*nb)}
function best(list,q,f){let m=9;for(const d of list||[]){const x=f(q,d);if(x<m)m=x}return m}
const STRICT1=.5; // when fingerprint B is missing: strict threshold + clear gap from the runner-up
const SAMPLE_MAX=.6; // automatic learning: a sample this far from the person's first photo is probably someone else
function learn(p,f,manual=false){ // every confirmation = one more sample (up to 20) — recognition gets stronger
  if(!f.desc)return false;
  p.descriptors=p.descriptors||[];p.hu=p.hu||[];
  if(!f.hu){if(!manual||best(p.descriptors,f.desc,dist)<.2)return false;p.descriptors.push(f.desc);if(p.descriptors.length>20)p.descriptors.splice(1,1);return true}
  if(best(p.descriptors,f.desc,dist)<.2&&best(p.hu,f.hu,cosd)<.08)return false; // near-identical sample adds nothing
  if(!manual&&p.descriptors.length&&dist(p.descriptors[0],f.desc)>SAMPLE_MAX+.05)return false;
  p.descriptors.push(f.desc);p.hu.push(f.hu);
  if(p.descriptors.length>20)p.descriptors.splice(1,1);if(p.hu.length>20)p.hu.splice(1,1);

}
function unlearn(p,f){const a=JSON.stringify(f.desc),b=f.hu?JSON.stringify(f.hu):'-';
  p.descriptors=(p.descriptors||[]).filter(d=>JSON.stringify(d)!==a);p.hu=(p.hu||[]).filter(d=>JSON.stringify(d)!==b)}
// thresholds (measured on labeled test sets: 0 wrong names, 0 strangers named at 'normal'): fa = A distance, hu = B (SFace) cosine distance
const SENS={strict:{fa:.62,hu:.52,label:'מחמיר'},normal:{fa:.65,hu:.55,label:'רגיל'},loose:{fa:.68,hu:.58,label:'רגיש'}};
function fileToCanvas(file,max){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');
    c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c)};
  im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}
function passport(src,b){ // חיתוך ביחס פספורט 35x45
  const cx=b.x+b.width/2,cy=b.y+b.height/2,w=b.width*1.75,h=w*45/35;
  const o=document.createElement('canvas');o.width=280;o.height=360;const g=o.getContext('2d');
  g.imageSmoothingQuality='high';g.fillStyle='#fff';g.fillRect(0,0,280,360);g.drawImage(src,cx-w/2,cy-h*.47,w,h,0,0,280,360);
  return o.toDataURL('image/jpeg',.88);
}
const overlap=(a,b)=>{const x1=Math.max(a.x,b.x),y1=Math.max(a.y,b.y),x2=Math.min(a.x+a.width,b.x+b.width),y2=Math.min(a.y+a.height,b.y+b.height);
  const I=Math.max(0,x2-x1)*Math.max(0,y2-y1);return I/Math.min(a.width*a.height,b.width*b.height)};
// find faces + fingerprint A: whole photo, then overlapping quarters for small faces at the back (quarters only ADD faces)
async function ssdFaces(c){
  const opt=new faceapi.SsdMobilenetv1Options({minConfidence:.45,maxResults:150}),out=[];
  const add=(d,ox,oy,tw,th)=>{const {x,y,width:w,height:hh}=d.detection.box;
    if(tw&&((x<2&&ox>0)||(y<2&&oy>0)||(x+w>tw-2&&ox+tw<c.width)||(y+hh>th-2&&oy+th<c.height)))return; // cut by a tile edge
    const box={x:x+ox,y:y+oy,width:w,height:hh};if(out.some(o=>overlap(o.box,box)>.3))return;
    const a=d.alignedRect.box;out.push({box,al:{x:a.x+ox,y:a.y+oy,width:a.width,height:a.height},p5:lm5(d.landmarks.positions,ox,oy),desc:Array.from(d.descriptor)})};
  (await faceapi.detectAllFaces(c,opt).withFaceLandmarks().withFaceDescriptors()).forEach(d=>add(d,0,0));
  const M=Math.max(c.width,c.height);
  if(M>900){const T=Math.round(M*.6),xs=c.width>T?[0,c.width-T]:[0],ys=c.height>T?[0,c.height-T]:[0];
    for(const y of ys)for(const x of xs){const w=Math.min(T,c.width),hh=Math.min(T,c.height),t=document.createElement('canvas');t.width=w;t.height=hh;
      t.getContext('2d').drawImage(c,x,y,w,hh,0,0,w,hh);(await faceapi.detectAllFaces(t,opt).withFaceLandmarks().withFaceDescriptors()).forEach(d=>add(d,x,y,w,hh))}}

}
// full analysis on 1600px; boxes returned in the original photo's coordinates
// YuNet (OpenCV Zoo, MIT): finds small and turned faces, and gives 5 face points directly
async function ynFaces(c,thr=.6){
  const W=c.width,H=c.height,pw=Math.ceil(W/32)*32,ph=Math.ceil(H/32)*32;
  const d=c.getContext('2d').getImageData(0,0,W,H).data,N=pw*ph,f=new Float32Array(3*N);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4,j=y*pw+x;f[j]=d[i+2];f[N+j]=d[i+1];f[2*N+j]=d[i]} // BGR, 0..255
  const o=await withTimeout(yunet.run({input:new ort.Tensor('float32',f,[1,3,ph,pw])}),60000),out=[];
  for(const st of [8,16,32]){const cols=pw/st,rows=ph/st,cl=o['cls_'+st].data,ob=o['obj_'+st].data,bb=o['bbox_'+st].data,kp=o['kps_'+st].data;
    for(let i=0;i<rows*cols;i++){const sc=Math.sqrt(Math.min(1,Math.max(0,cl[i]))*Math.min(1,Math.max(0,ob[i])));if(sc<thr)continue;

      const p5=[0,1,2,3,4].map(n=>[(kp[i*10+2*n]+cc)*st,(kp[i*10+2*n+1]+r)*st]);
      out.push({box:{x:cx-w/2,y:cy-hh/2,width:w,height:hh},p5,score:sc})}}

// fingerprint A for a face only YuNet found: square crop → 68 points → aligned face → descriptor
async function faDescCrop(src,b){
  const s=Math.max(b.width,b.height)*1.35,cx=b.x+b.width/2,cy=b.y+b.height/2,c=document.createElement('canvas');c.width=c.height=200;
  const g=c.getContext('2d');g.imageSmoothingQuality='high';g.fillStyle='#808080';g.fillRect(0,0,200,200);g.drawImage(src,cx-s/2,cy-s/2,s,s,0,0,200,200);

async function analyze(hi,progress){
  const k=Math.min(1,1600/Math.max(hi.width,hi.height)),c=document.createElement('canvas');
  c.width=Math.round(hi.width*k);c.height=Math.round(hi.height*k);c.getContext('2d').drawImage(hi,0,0,c.width,c.height);
  const found=await ssdFaces(c),s=hi.width/c.width;
  if(USE_YN&&yunet){let yn=[];try{yn=await ynFaces(c)}catch(e){}
    for(const y of yn){const m=found.find(f=>overlap(f.box,y.box)>.4);
      if(m){m.p5=y.p5;continue} // same face: YuNet's 5 points align better
      if(y.score<.75||Math.min(y.box.width,y.box.height)<14)continue; // only clear extra faces
      let desc=null;try{desc=await faDescCrop(c,y.box)}catch(e){}
      if(desc)found.push({box:y.box,p5:y.p5,desc,yn:1})}}
  for(let i=0;i<found.length;i++){if(progress)progress(i+1,found.length);try{found[i].hu=await sfEmb(c,found[i].p5)}catch(e){found[i].hu=null}}
  return found.map(f=>({box:{x:f.box.x*s,y:f.box.y*s,width:f.box.width*s,height:f.box.height*s},desc:f.desc,hu:f.hu}));
}
// background upgrade: everyone without a current fingerprint B gets one from their card photo (fast — one face each)
async function upgradePeople(){

      if(x&&x.hu){p.hu=[x.hu];p.huV=HU_V;p.descriptors=p.descriptors||[];if(best(p.descriptors,x.desc,dist)>=.2)p.descriptors.unshift(x.desc)}else{p.hu=[];p.huV=HU_V;p.huTried=1}}
    catch(e){p.huTried=1}

}

async function handleFile(file){

  if(!found.length){setStatus('');toast('לא נמצאו פרצופים בתמונה');return}
  found.sort((a,b)=>b.box.x-a.box.x); // מימין לשמאל

function matchFaces(faces,gid){
  const T0=SENS[S.sens]||SENS.normal,usable=S.people.filter(p=>p.descriptors&&p.descriptors.length);
  if(!usable.length)return;
  const cand=[];
  faces.forEach((f,i)=>{if(!f.desc)return;
    const A=usable.map(p=>({p,d:best(p.descriptors,f.desc,dist)})).sort((x,y)=>x.d-y.d);
    const adj=USE_GROUP&&gid?(inGroup(A[0].p,gid)?GP_IN:-GP_OUT):0,T={fa:T0.fa+adj,hu:T0.hu+adj};
    const a=A[0],withHu=usable.filter(p=>p.hu&&p.hu.length);
    if(f.hu&&a.p.hu&&a.p.hu.length){ // both engines: must agree
      const b=withHu.map(p=>({p,d:best(p.hu,f.hu,cosd)})).sort((x,y)=>x.d-y.d)[0];
      if(a.p===b.p&&a.d<T.fa&&b.d<T.hu)cand.push({i,p:a.p,s:a.d/T.fa+b.d/T.hu});
    }else if(a.d<STRICT1&&(!A[1]||A[1].d-a.d>.05))cand.push({i,p:a.p,s:a.d/STRICT1+1}); // engine 1 alone: strict
  });

let regBusy=false,regLast=0;
async function pullReg(manual=false){
  if(!S.reg||regBusy)return;const now=Date.now();
  const before=(S.invites||[]).length;S.invites=(S.invites||[]).filter(v=>now<v.exp+2*864e5);
  if(S.invites.length!==before)save();
  if(!S.invites.some(v=>now<v.exp+864e5)&&!manual)return;
  regBusy=true;regLast=now;
  try{
    const {subs}=await regApi('pull'),names=[],done=[];
    for(const s of subs){const v=S.invites.find(x=>x.t===s.t);
      if(!v){continue} // not this device's link — leave it
      done.push(s.id);const f=v.faces.find(x=>x.i===s.i),ses=SES(v.sid);if(!f||f.pid||!ses)continue;
      const cl=x=>String(x||'').replace(/^[\s=+\-@]+/,'').trim().slice(0,60);s.first=cl(s.first);s.last=cl(s.last);
      const name=[s.first,s.last].filter(Boolean).join(' ');if(!name)continue;
      const cf=cur&&cur.sid===v.sid?cur.faces[s.i]:null;
      let p=S.people.find(x=>norm(fullName(x))===norm(name));
      if(cf&&cf.pid&&(!p||cf.pid!==p.id)){f.pid=cf.pid;continue} // the owner already named this face himself — his choice wins
      if(p){if(!ses.present.includes(p.id))learn(p,{desc:f.desc,hu:f.hu},true);
        const ex=s.extra||{};S.fields.forEach(k=>{if(ex[k]&&!(p.extra||{})[k])(p.extra=p.extra||{})[k]=ex[k]})}
      else{const ex={};S.fields.forEach(k=>{if((s.extra||{})[k])ex[k]=s.extra[k]});
        p={id:uid(),first:s.first||'',last:s.last||'',extra:ex,groups:[],photo:f.crop,photoTs:ses.ts,descriptors:f.desc?[f.desc]:[],hu:f.hu?[f.hu]:[],huV:HU_V,created:Date.now(),selfReg:Date.now()};S.people.push(p)}
      setPhoto(p,f.crop,ses.ts);if(!ses.present.includes(p.id))ses.present.push(p.id);
      if(ses.group&&G(ses.group)&&!inGroup(p,ses.group))toggleMember(p,ses.group);
      f.pid=p.id;if(cf){cf.pid=p.id;cf.skip=false}names.push(fullName(p));
    }
    if(names.length){await save();renderAll();toast(tr('נרשמו בעצמם')+': '+names.join(', ')+' ✓')}else if(manual)toast('עדיין אף אחד חדש');
    if(done.length)regApi('ack',{ids:done}).catch(()=>{});
  }catch(e){if(manual)toast('לא הצלחתי לבדוק — בדקו חיבור לאינטרנט')}
  finally{regBusy=false}
}

async function undoMatch(fi){
  const f=cur.faces[fi],ses=SES(cur.sid),p=f&&P(f.pid);if(!p||!ses)return;
  if(f.learned){unlearn(p,f);if(!p.descriptors.length){p.descriptors=[f.desc];p.hu=f.hu?[f.hu]:[]}}
  if(f.prev&&p.photo===f.crop){p.photo=f.prev.photo;p.photoTs=f.prev.ts}
  if(!cur.faces.some((x,i)=>i!==fi&&x.pid===p.id)){ses.present=ses.present.filter(x=>x!==p.id);
    // the wrong match had also put them in this photo's group — take that back too (unless they really attended that group another time)
    (f.addedG||[]).forEach(g=>{if(inGroup(p,g)&&!S.sessions.some(s=>s.id!==ses.id&&s.group===g&&s.present.includes(p.id)))toggleMember(p,g)})}
  f.addedG=null;
  (f.no=f.no||[]).push(p.id);f.pid=null;f.learned=false;
  await save();closeSheet();renderAll();setTimeout(()=>nameSheet(fi),320);
}

}

    openSheet(`<h2 style="margin-top:6px">ייצוא</h2><div class="meta">בחרו מה לייצא ובאיזה פורמט</div>
      <div class="sub">מפגשים</div><div class="gwrap" id="exM">${o.sids.length?chip('pick',o.mode==='pick',o.sids.length===1?'המפגש הזה':o.sids.length+' נבחרים'):''}${chip('all',o.mode==='all','הכל')}${chip('range',o.mode==='range','טווח תאריכים')}</div>
      ${o.mode==='range'?`<div class="fl" style="margin-top:10px"><div class="fr"><label>מתאריך</label><input type="date" id="exF" value="${o.from}"></div><div class="fr"><label>עד תאריך</label><input type="date" id="exT" value="${o.to}"></div></div>`:''}
      <div class="sub">אנשים</div><div class="gwrap" id="exG">${chip('',!o.group,'כולם')}${S.groups.map(g=>chip(g.id,o.group===g.id,esc(g.name))).join('')}</div>
      <div class="sub">פורמט</div><div class="gwrap" id="exP">${chip('xlsx',o.fmt==='xlsx','אקסל')}${chip('pdf',o.fmt==='pdf','PDF')}</div>
      <div class="sugg" style="margin-top:18px"><span class="n">${sel.length?`<b>${sel.length}</b> מפגשים · <b>${ppl.length}</b> אנשים`:'אין מפגשים שמתאימים לסינון'}<br><small style="color:var(--mute)">${esc(filterText(o,sel))}${o.fmt==='pdf'&&sel.length===1?' · עם תמונות':''}</small></span></div>
      <button class="btn pri full" id="exGo" ${sel.length?'':'disabled'} style="margin-top:12px">ייצוא ל${o.fmt==='pdf'?'-PDF':'אקסל'}</button>`);
    const bind=(id,fn)=>$(id).querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{fn(b.dataset.v);draw()});
    bind('#exM',v=>o.mode=v);bind('#exG',v=>o.group=v);bind('#exP',v=>o.fmt=v);
    if($('#exF')){$('#exF').onchange=e=>{o.from=e.target.value;draw()};$('#exT').onchange=e=>{o.to=e.target.value;draw()}}
    $('#exGo').onclick=async()=>{const b=$('#exGo');b.disabled=true;b.textContent='מכין…';try{o.fmt==='pdf'?await exportPdf(o):exportExcel(o)}finally{closeSheet()}};
  };
  draw();
}
$('#setBtn').onclick=()=>{
  openSheet(`<h2 style="margin-top:6px">הגדרות</h2><div class="meta">${S.people.length} אנשים · ${S.sessions.length} מפגשים</div>
    <div class="list">
      <div class="li"><span class="n">רגישות זיהוי</span><span class="gwrap" id="sSens">${Object.entries(SENS).map(([k,v])=>`<button class="gchip ${(S.sens||'normal')===k?'on':''}" data-k="${k}">${v.label}</button>`).join('')}</span></div>
      ${dupGroups().length?`<button class="li" id="sDup"><span class="n" style="color:var(--blue)">איחוד כפילויות (${dupGroups().length})<br><small style="color:var(--mute)">${dupGroups().map(a=>esc(fullName(a[0]))).slice(0,4).join(', ')}${dupGroups().length>4?'…':''} — רשומים פעמיים</small></span></button>`:''}
      <button class="li" id="sRebuild"><span class="n">בניית הזיהוי מחדש<br><small style="color:var(--mute)">לפי התמונה שבכרטיס של כל אחד</small></span></button>
      <button class="li" id="sReg"><span class="n">הרשמה עצמית בקישור<br><small style="color:var(--mute)">${S.reg?'מחובר ✓':'התלמידים מזהים את עצמם ורושמים פרטים'}</small></span></button>
      <button class="li" id="sCode"><span class="n">שינוי קוד</span></button>
      <button class="li" id="sExp"><span class="n">גיבוי — הורדת קובץ</span></button>
      <button class="li" id="sImp"><span class="n">שחזור מגיבוי</span></button>
      <button class="li" id="sCsv"><span class="n">ייצוא נוכחות — אקסל / PDF</span></button>
    </div>
    <div class="acts" style="margin-top:18px"><button class="btn dan" id="sWipe">מחיקת כל הנתונים</button></div>
    <p style="color:var(--mute);font-size:12px;text-align:center;margin-top:16px">הכל נשמר רק במכשיר הזה. מומלץ לגבות מדי פעם.</p>`);
  $('#sSens').querySelectorAll('[data-k]').forEach(x=>x.onclick=()=>withCode(async()=>{S.sens=x.dataset.k;await save();$('#sSens').querySelectorAll('[data-k]').forEach(y=>y.classList.toggle('on',y===x));toast('רגישות: '+SENS[S.sens].label)}));
  if($('#sDup'))$('#sDup').onclick=()=>withCode(async()=>{const dg=dupGroups();
    const ok=await dialog({type:'confirm',title:'לאחד '+dg.length+' כפילויות?',text:'כל מי שרשום יותר מפעם אחת יאוחד לכרטיס אחד — עם כל התמונות, הנוכחות והקבוצות.',okText:'איחוד'});if(!ok)return;
    dg.forEach(a=>{const [keep,...rest]=[...a].sort((x,y)=>(x.created||0)-(y.created||0));rest.forEach(d=>mergeInto(keep,d))});
    await save();closeSheet();renderAll();toast('אוחדו ✓ — הזיהוי שלהם התחזק')});
  $('#sRebuild').onclick=()=>withCode(async()=>{
    const ok=await dialog({title:'לבנות את הזיהוי מחדש?',text:'כל אדם יזוהה מעכשיו לפי התמונה בכרטיס שלו. כדאי לוודא קודם שהתמונות נכונות. הקלידו "כן" לאישור',check:v=>isWord(v,'כן')});if(ok===null)return;
    try{await modelsReady}catch(e){toast('מנוע הזיהוי לא נטען');return}
    let good=0;const bad=[];
    for(const p of S.people){try{const x=largest(await analyze(await imgToCanvas(p.photo)));if(x&&x.hu){p.descriptors=[x.desc];p.hu=[x.hu];p.huV=HU_V;good++}else bad.push(fullName(p))}catch(e){bad.push(fullName(p))}}
    await save();closeSheet();renderAll();
    toast(bad.length?`${good} עודכנו · ${bad.length} ללא פרצוף ברור`:`הזיהוי נבנה מחדש ל-${good} ✓`)});
  $('#sReg').onclick=()=>withCode(regSetup);
  $('#sCode').onclick=()=>withCode(async()=>{const n=await dialog({title:'קוד חדש',text:'4 ספרות לפחות',type:'text',check:v=>/^\d{4,}$/.test(v)});if(n){S.code=n;await save();toast('הקוד עודכן ✓')}});
  $('#sExp').onclick=()=>download(tr('גיבוי-נוכחות')+'-'+dayKey(Date.now())+'.json',JSON.stringify(S),'application/json');
  $('#sImp').onclick=()=>withCode(()=>$('#fImp').click());
  $('#sCsv').onclick=()=>openExport();
  $('#sWipe').onclick=()=>withCode(async()=>{const ok=await dialog({title:'למחוק הכל?',text:'הקלידו "מחק" לאישור',check:v=>isWord(v,'מחק')});if(ok===null)return;
    S={people:[],fields:[],sessions:[],groups:[],code:S.code,reg:S.reg};curGroup='';sesG='';cur=null;await save();closeSheet();renderAll();toast('נמחק')});
};
$('#fImp').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());if(!Array.isArray(d.people)||!Array.isArray(d.sessions))throw 0;
    S={people:d.people,fields:d.fields||[],sessions:d.sessions,groups:d.groups||[],code:d.code||S.code,reg:d.reg||S.reg,invites:d.invites||[]};migrate();cur=null;await save();closeSheet();renderAll();toast('שוחזר ✓')}
  catch(err){toast('קובץ גיבוי לא תקין')}};

/* ---------- nav ---------- */
function showView(v){
  const b=document.querySelector(`nav button[data-v="${v}"]`);if(!b)return;
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('act',x===b));
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('act',x.id===v));
}
let restoring=true,uiT;
function saveUI(){if(restoring)return;clearTimeout(uiT);uiT=setTimeout(()=>{
  const v=(document.querySelector('nav button.act')||{}).dataset;
  idb.set('ui',{v:v&&v.v,g:curGroup,q:$('#q').value,sens:sesG,cur,y:window.scrollY}).catch(()=>{})},250)}
addEventListener('scroll',saveUI,{passive:true});
addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(uiT);restoring=false;
  const v=(document.querySelector('nav button.act')||{}).dataset;idb.set('ui',{v:v&&v.v,g:curGroup,q:$('#q').value,sens:sesG,cur,y:window.scrollY}).catch(()=>{})}});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('act',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('act',v.id===b.dataset.v));
  window.scrollTo(0,0);renderSelBar();saveUI();
});
function renderAll(){renderCapture();renderPeople();renderAtt();saveUI()}
function migrate(){S.people.forEach(p=>{if(p.huV!==HU_V){p.hu=[];delete p.huTried}});S.groups=S.groups||[];S.sens=S.sens||'normal';S.people.forEach(p=>{p.groups=p.groups||[];if(!p.photoTs)p.photoTs=p.created||0;
  if(!S.cleaned&&p.descriptors&&p.descriptors.length>1){const o=p.descriptors[0];p.descriptors=p.descriptors.filter((d,i)=>i===0||dist(o,d)<=SAMPLE_MAX)}});S.cleaned=1}
// איחוד כפילויות: אותו שם = אותו אדם
function dupGroups(){const m={};S.people.forEach(p=>{const k=norm(fullName(p));if(k&&k!=='ללא שם')(m[k]=m[k]||[]).push(p)});return Object.values(m).filter(a=>a.length>1)}
function mergeInto(keep,d){
  const cap=a=>a.length>20?[a[0],...a.slice(-19)]:a;keep.descriptors=cap([...(keep.descriptors||[]),...(d.descriptors||[])]);keep.hu=cap([...(keep.hu||[]),...(d.hu||[])]);
  keep.groups=[...new Set([...(keep.groups||[]),...(d.groups||[])])];
  keep.extra={...(d.extra||{}),...Object.fromEntries(Object.entries(keep.extra||{}).filter(([k,v])=>v))};
  if((d.photoTs||0)>(keep.photoTs||0)){keep.photo=d.photo;keep.photoTs=d.photoTs}
  S.sessions.forEach(s=>{if(s.present.includes(d.id)){s.present=s.present.filter(x=>x!==d.id);if(!s.present.includes(keep.id))s.present.push(keep.id)}});
  if(cur)cur.faces.forEach(f=>{if(f.pid===d.id)f.pid=keep.id});
  S.people=S.people.filter(x=>x.id!==d.id);
}

/* ---------- install / share ---------- */
let deferredPrompt=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
if(isIOS&&!isStandalone())$('#instBtn').classList.add('show');
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('#instBtn').classList.add('show')});
addEventListener('appinstalled',()=>{deferredPrompt=null;$('#instBtn').classList.remove('show');toast('PO הותקנה ✓')});
$('#instBtn').onclick=async()=>{
  if(deferredPrompt){deferredPrompt.prompt();const r=await deferredPrompt.userChoice;deferredPrompt=null;if(r.outcome==='accepted')$('#instBtn').classList.remove('show');return}
  if(isIOS)openSheet(`<img class="pp" src="icon-192.png" style="width:84px;aspect-ratio:1;border-radius:20px"><h2>התקנת PO</h2>
    <div class="meta">באייפון ההתקנה נעשית מתוך ספארי</div>
    <div class="list"><div class="li"><span class="n">1. לוחצים על כפתור השיתוף <b>⎙</b> בתחתית ספארי</span></div>
    <div class="li"><span class="n">2. בוחרים "הוספה למסך הבית"</span></div><div class="li"><span class="n">3. לוחצים "הוסף"</span></div></div>
    <div style="margin-top:18px"><button class="btn pri full" onclick="closeSheet()">הבנתי</button></div>`);
};
$('#shareBtn').onclick=async()=>{
  const data={title:'PO',text:tr('PO — נוכחות לפי זיהוי פנים'),url:location.href.split('#')[0]};
  if(navigator.share){try{await navigator.share(data)}catch(e){}return}
  try{await navigator.clipboard.writeText(data.url);toast('הקישור הועתק')}catch(e){toast(data.url)}
};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

/* ---------- boot ---------- */
(async()=>{
  applyLang();paintLock();
  let ui=null;
  try{await idb.open();const st=await idb.get('state');if(st)S={...S,...st};ui=await idb.get('ui')}catch(e){toast('האחסון לא זמין')}
  migrate();
  // return exactly where you were: tab, group filter, search, and the photo you were naming
  if(ui){if(ui.cur&&ui.cur.sid&&S.sessions.some(s=>s.id===ui.cur.sid))cur=ui.cur;if(ui.g&&G(ui.g))curGroup=ui.g;if(ui.q)$('#q').value=ui.q;if(ui.sens)sesG=ui.sens}
  S.sessions=S.sessions.filter(s=>s.present.length||invOf(s.id)||(cur&&s.id===cur.sid));
  if(ui&&ui.v)showView(ui.v);
  renderAll();restoring=false;loadModels();setTimeout(()=>pullReg(),1500);
  if(ui&&ui.y)setTimeout(()=>window.scrollTo(0,ui.y),60);
})();
</script>
</body>
</html>
